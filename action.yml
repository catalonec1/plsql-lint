name: plsql-lint
description: Lint Oracle SQL and PL/SQL files and annotate the pull request.
branding:
  icon: database
  color: red
inputs:
  paths:
    description: Files or directories to lint
    default: "."
  args:
    description: Extra arguments for plsql-lint (e.g. --ignore PLL006)
    default: ""
  version:
    description: plsql-lint git tag to install (default v0.1.0)
    default: "v0.1.0"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - shell: bash
      run: |
        pip install "git+https://github.com/catalonec1/plsql-lint@${{ inputs.version }}"
        plsql-lint --format github ${{ inputs.args }} ${{ inputs.paths }}
